<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Audio and Video Player</title>
</head>
<body>
    <h1>HTML Audio and Video Player</h1>

    <section>
        <h2>HTML Audio Player</h2>
        <audio 
            controls
            loop
            src="playlist/moment-of-peace.mp3"
        >
        </audio>
        <p>
            Music by <a href="https://pixabay.com/users/mickeyscat-35308165/?utm_source=link-attribution&utm_medium=referral&utm_campaign=music&utm_content=554494">MickeysCat</a> from <a href="https://pixabay.com//?utm_source=link-attribution&utm_medium=referral&utm_campaign=music&utm_content=554494">Pixabay</a>
        </p>
    </section>
    <section>
        <h2>HTML Video Player</h2>
        <video
            controls
            muted
            width="640"
        >
            <source
                src="playlist/guitar.mp4"
                type="video/mp4"
            >
        </video>
        <p>
            Video by <a href="https://pixabay.com/users/ninosouza-8385382/?utm_source=link-attribution&utm_medium=referral&utm_campaign=video&utm_content=35862">Nino Souza Nino</a> from <a href="https://pixabay.com//?utm_source=link-attribution&utm_medium=referral&utm_campaign=video&utm_content=35862">Pixabay</a>
        </p>
    </section>
</body>
</html>
